[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbscale"
version = "0.1.0"
description = "Know how your database will behave before it gets big. Database scalability experimentation framework."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["database", "postgres", "benchmark", "scalability", "performance", "synthetic-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "psycopg[binary]>=3.1",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.11",
]

[project.scripts]
dbscale = "dbscale.cli.main:app"

[project.urls]
Homepage = "https://github.com/dbscale/dbscale"

[tool.hatch.build.targets.wheel]
packages = ["src/dbscale"]

[tool.pytest.ini_options]
pythonpath = ["tests", "tests/integration"]
testpaths = ["tests"]
markers = [
  "integration: tests that require Docker and a PostgreSQL container",
  "stress: large-scale checks; kept cheap enough to run, but separated from unit tests",
]
addopts = "-ra"
timeout = 600

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]  # UP042: `str, Enum` kept for pydantic/JSON interop on 3.11

[tool.coverage.run]
source = ["dbscale"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.11"
packages = ["dbscale"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
