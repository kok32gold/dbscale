# Queries whose cost grows with table size.
#
#   docker compose -f ../postgres/docker-compose.yml up -d
#   dbscale run
name: scaling-risk

database:
  type: postgres
  connection: ${DATABASE_URL:-postgresql://postgres:src@127.0.0.1:55432/shop}
  schemas: [public]

scale:
  targets: [1x, 10x, 100x]

workload:
  runs: 3
  warmup: 1
  timeout_ms: 60000
  queries:
    - name: large-sort
      file: ../postgres/queries/large_sort.sql
    - name: aggregation
      file: ../postgres/queries/aggregation.sql

thresholds:
  p95_ms: 100

sandbox:
  type: docker
  image: postgres:16-alpine

ai:
  enabled: false

output:
  json: dbscale-results.json
