# Smallest experiment: one indexed lookup against the demo database.
#
#   docker compose -f ../postgres/docker-compose.yml up -d
#   dbscale run
name: simple-postgres

database:
  type: postgres
  connection: ${DATABASE_URL:-postgresql://postgres:src@127.0.0.1:55432/shop}
  schemas: [public]

scale:
  targets: [1x, 10x]

workload:
  runs: 3
  warmup: 1
  timeout_ms: 60000
  queries:
    - name: indexed-lookup
      file: ../postgres/queries/indexed_lookup.sql

thresholds:
  p95_ms: 100

sandbox:
  type: docker
  image: postgres:16-alpine

ai:
  enabled: false

output:
  json: dbscale-results.json
