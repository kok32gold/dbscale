name: Feature request
description: A capability DBScale should have
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered solving it.
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Who needs this, and what they run (local PostgreSQL, another engine, no AI, and so on).
    validations:
      required: true
