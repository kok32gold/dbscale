name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Unit tests and coverage
        run: pytest tests/unit tests/stress --cov=dbscale --cov-branch --cov-report=term-missing
      - name: Dependency audit
        if: matrix.python == '3.11'
        run: |
          python -m pip install -U pip "setuptools>=83"
          python -m pip install pip-audit
          pip-audit

  integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          DBSCALE_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: pytest tests/integration

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build
        run: mkdocs build --strict
