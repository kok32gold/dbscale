name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Unit tests and coverage
        run: pytest tests/unit tests/stress --cov=dbscale --cov-branch --cov-report=term-missing

  integration:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests
        env:
          DBSCALE_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: pytest tests/integration
